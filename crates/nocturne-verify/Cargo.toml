[package]
name = "nocturne-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Offline decoder and signature/Merkle-root verifier for Morpho Midnight offer payloads - defeats blind signing by letting a signer independently reproduce what they are about to sign."
authors = ["Oliver Tipton <oliverptipton@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Oliverpt-1/Nocturne"
homepage = "https://github.com/Oliverpt-1/Nocturne"
keywords = ["ethereum", "morpho", "midnight", "eip712", "blind-signing"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "nocturne-verify"
path = "src/main.rs"

[dependencies]
nocturne = { path = "../nocturne" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
