[package]
name = "nocturne"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Off-chain Rust SDK for Morpho Midnight: EIP-712 offer hashing, Merkle trees, signing, simulation, decoding, and calldata encoding."
authors = ["Oliver Tipton <oliverptipton@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Oliverpt-1/midnight-rust"
homepage = "https://github.com/Oliverpt-1/midnight-rust"
readme = "../../README.md"
keywords = ["ethereum", "eip712", "morpho", "midnight", "defi"]
categories = ["cryptography::cryptocurrencies", "finance", "encoding"]

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rayon = "1.10"
ruint = { version = "1.12", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints.clippy]
# These lints suggest newer stdlib methods (is_multiple_of on 1.87, repeat_n/div_ceil) that would
# raise our MSRV, or restyle test helpers; the manual forms are intentional.
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
manual_div_ceil = "allow"
needless_range_loop = "allow"
