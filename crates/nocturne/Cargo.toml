[package]
name = "nocturne-midnight"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Off-chain Rust SDK for Morpho Midnight: EIP-712 offer hashing, Merkle trees, signing, simulation, decoding, and calldata encoding."
authors = ["Oliver Tipton <oliverptipton@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Oliverpt-1/Nocturne"
homepage = "https://github.com/Oliverpt-1/Nocturne"
readme = "README.md"
keywords = ["ethereum", "eip712", "morpho", "midnight", "defi"]
categories = ["cryptography::cryptocurrencies", "finance", "encoding"]

[lib]
name = "nocturne"
path = "src/lib.rs"

# Drivers for the live e2e harness (invoked by e2e/run.sh and e2e/mm.sh). They live next to
# their scripts rather than in examples/, which holds the SDK usage recipes.
[[example]]
name = "e2e"
path = "e2e/e2e.rs"

[[example]]
name = "mm_loop"
path = "e2e/mm_loop.rs"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ruint = { version = "1.12", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
alloy-primitives = "1.6"
alloy-sol-types = "1.6"
flate2 = "1.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
rayon = "1.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
# These lints suggest newer stdlib methods (is_multiple_of on 1.87, repeat_n/div_ceil) that would
# raise our MSRV, or restyle test helpers; the manual forms are intentional.
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
manual_div_ceil = "allow"
needless_range_loop = "allow"
