[package]
name = "nocturne"
version = "0.1.0"
edition = "2021"
description = "Off-chain Rust SDK for Morpho Midnight: EIP-712 offer hashing, Merkle trees, signing, simulation, decoding, and calldata encoding."

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rayon = "1.10"
ruint = { version = "1.12", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
