name: Release

# Build and attach nocturne-verify binaries when a version tag is pushed, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p nocturne-verify
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/nocturne-verify"
          out="nocturne-verify-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C "$(dirname "$bin")" nocturne-verify
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Automated release." || true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
